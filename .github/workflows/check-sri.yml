name: Check SRI hashes

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # The node release is built on Windows, Docker images clone on Linux: both must match.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-sri.py
